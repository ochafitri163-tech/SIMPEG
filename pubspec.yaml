name: simpeg_mobile
description: SIMPEG Mobile - PERUMDAM Tirta Darma Ayu

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1

  # PDF & Printing
  pdf: ^3.10.8
  printing: ^5.13.1

  # Image Picker
  image_picker: ^1.1.2

  # Lokasi / GPS (untuk absensi check-in)
  geolocator: ^13.0.1

  # Supabase & HTTP
  supabase_flutter: ^2.8.0
  http: ^1.6.0

  # State Management & Preferences
  provider: ^6.1.1
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2

  # Local Notifications & Push Notifications
  flutter_local_notifications: ^17.2.4
  onesignal_flutter: ^5.2.7
  firebase_core: ^3.10.0
  firebase_messaging: ^15.2.0

  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.2.5
  timezone: ^0.9.4
  package_info_plus: ^8.1.2
  permission_handler: ^11.3.1
  file_picker: ^8.1.2
  record: ^5.1.2
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21


flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/images/bg_air.jpg
    - assets/images/splash_bg.png

dependency_overrides:
  record_linux: ^1.1.0
  record_platform_interface: ^1.3.0